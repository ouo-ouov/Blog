plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'me.shinsunyoung'
version = '0.0.1-SNAPSHOT'
description = 'springboot-developer'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {

    // [AWS S3 업로드용] AWS SDK for Java v2 의 S3 모듈 (버전 2.41.31)
    //   - S3Config.java 의 S3Client, AwsS3Service.java 의 PutObjectRequest·RequestBody 클래스가
    //     이 라이브러리에 들어 있다.
    //   - 함께 딸려 오는 라이브러리: regions(Region 클래스), auth(자격 증명 조회),
    //     apache-client(실제 HTTPS 요청을 보내는 ApacheHttpClient) 등
    implementation 'software.amazon.awssdk:s3:2.41.31'

    // [AWS RDS 연결용] MySQL JDBC 드라이버
    //   - 일래스틱 빈스톡 환경 속성 SPRING_DATASOURCE_URL = jdbc:mysql://<RDS 엔드포인트>:3306/blog 의
    //     "jdbc:mysql:" 주소를 처리하는 com.mysql.cj.jdbc.Driver 클래스가 이 라이브러리 안에 있다.
    //   - 스프링 부트의 DataSourceAutoConfiguration 이 URL 이 jdbc:mysql 로 시작하는 것을 보고
    //     com.mysql.cj.jdbc.Driver 를 드라이버로 골라 HikariDataSource 객체(커넥션 풀)를 만든다.
    //   - 버전을 적지 않은 이유: io.spring.dependency-management 플러그인이
    //     스프링 부트 4.0.1 이 검증해 둔 버전을 자동으로 채워 넣는다.
    implementation 'com.mysql:mysql-connector-j'

    // ===== [11장 추가] OAuth2 클라이언트 (구글 로그인) =====
    // oauth2Login(), /oauth2/authorization/{등록이름}, /login/oauth2/code/{등록이름} 처리 필터,
    // DefaultOAuth2UserService, OAuth2AuthorizationRequest 같은 클래스가 이 의존성에 들어 있습니다.
    // application.yml 의 spring.security.oauth2.client.registration.google 설정도 이 의존성이 읽습니다.
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.0-M1')
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    // ===== [10장] JWT 관련 의존성 (교안 10.2 · 01단계) =====
    // 추가한 뒤 IntelliJ 오른쪽 Gradle 탭에서 새로고침(Reload)을 눌러 내려받으세요.
    // ⚠️ 교안 코드는 jjwt 0.9.1 기준입니다. 0.10 이상에서는 setSigningKey(String),
    //    parseClaimsJws 등의 사용법이 바뀌므로 버전을 그대로 맞추세요.
    implementation 'io.jsonwebtoken:jjwt:0.9.1'  //자바 JWT 라이브러리 (토큰 만들기 Jwts.builder(), 읽기 Jwts.parser())
    // jjwt 0.9.1 은 내부에서 javax.xml.bind.DatatypeConverter(Base64 변환)를 씁니다.
    // 자바 11부터 이 기능이 JDK 에서 빠졌기 때문에 따로 추가해야 실행 오류가 나지 않습니다.
    implementation 'javax.xml.bind:jaxb-api:2.3.1' //XML 문서와 자바 객체 간 매핑 자동화
    testImplementation 'org.springframework.security:spring-security-test'
    runtimeOnly 'com.h2database:h2'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
